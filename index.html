<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0714" />
    <meta name="description" content="闇の塔を進む、スマホ対応アクションゲーム。" />
    <meta property="og:title" content="Tower Guardian" />
    <meta property="og:description" content="闇の塔を進む、スマホ対応アクションゲーム。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tower Guardian" />
    <title>Tower Guardian</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="app-header">
      <h1>Tower Guardian</h1>
      <button id="installButton" class="install-button" type="button" hidden>アプリをインストール</button>
    </header>

    <main class="game-shell">
      <canvas id="gameCanvas" width="800" height="600" aria-label="Tower Guardian ゲーム画面"></canvas>

      <div id="touchControls" aria-label="タッチ操作">
        <div class="dpad" aria-label="移動">
          <button class="touch-button up" data-key="up" aria-label="上へ移動">▲</button>
          <button class="touch-button left" data-key="left" aria-label="左へ移動">◀</button>
          <button class="touch-button down" data-key="down" aria-label="下へ移動">▼</button>
          <button class="touch-button right" data-key="right" aria-label="右へ移動">▶</button>
        </div>
        <div class="actions" aria-label="アクション">
          <button class="touch-button action" data-key="action" aria-label="アクション">Z</button>
          <button class="touch-button dash" data-key="dash" aria-label="ダッシュ">DASH</button>
          <button class="touch-button fire" data-key="fire" aria-label="攻撃">FIRE</button>
        </div>
        <button class="touch-button pause" data-key="pause" aria-label="一時停止">Ⅱ</button>
      </div>

      <div class="rotate-hint" role="status">
        <span class="phone-icon" aria-hidden="true">↻</span>
        <strong>スマホを横向きにしてください</strong>
        <span>横画面で快適に遊べます</span>
      </div>
    </main>

    <noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
    <script src="game.js"></script>
    <script src="pwa.js"></script>
  </body>
</html>
