<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#25160f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ピンポン">
  <title>ピンポン</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="title-area">
      <div>
        <p class="eyebrow">TABLE ARCADE</p>
        <h1>ピンポン</h1>
      </div>
      <button id="headerMenuButton" class="header-menu-button" type="button" aria-label="ゲームメニューを開く">☰ メニュー</button>
    </header>

    <section class="game-frame" aria-label="ピンポンゲーム">
      <div class="score score-cpu" aria-live="polite">
        <span>CPU</span><strong id="cpuScore">0</strong>
      </div>

      <canvas id="gameCanvas" width="480" height="800">
        このゲームを遊ぶにはCanvas対応ブラウザが必要です。
      </canvas>

      <div class="score score-player" aria-live="polite">
        <span>YOU</span><strong id="playerScore">0</strong>
      </div>

      <div id="menu" class="overlay">
        <div class="panel">
          <p class="panel-label">先に5点で勝利</p>
          <h2>難易度を選ぶ</h2>
          <div class="difficulty-group" role="radiogroup" aria-label="CPUの難易度">
            <button class="difficulty" type="button" data-level="easy" role="radio" aria-checked="false"><strong>弱</strong><span>木製</span></button>
            <button class="difficulty selected" type="button" data-level="normal" role="radio" aria-checked="true"><strong>中</strong><span>緑の卓球台</span></button>
            <button class="difficulty" type="button" data-level="hard" role="radio" aria-checked="false"><strong>強</strong><span>エアホッケー</span></button>
          </div>
          <div id="hardLevelPanel" class="hard-level-panel hidden" aria-label="エアホッケーレベル">
            <p>エアホッケー LEVEL <strong id="hardLevelLabel">1</strong></p>
            <div class="level-group">
              <button class="level selected" type="button" data-hard-level="1">1</button>
              <button class="level" type="button" data-hard-level="2">2</button>
              <button class="level" type="button" data-hard-level="3">3</button>
              <button class="level" type="button" data-hard-level="4">4</button>
              <button class="level" type="button" data-hard-level="5">5</button>
            </div>
          </div>
          <button id="startButton" class="primary-button" type="button">ゲームスタート</button>
          <div class="connection-launch-actions" aria-label="WebRTC接続実験">
            <button id="createConnectionButton" class="secondary-button" type="button">接続実験を作る</button>
            <button id="joinConnectionButton" class="secondary-button" type="button">接続実験に参加する</button>
          </div>
          <p class="help">タップ、ドラッグ、またはマウスでラケットを動かします</p>
        </div>
      </div>

      <div id="gameOver" class="overlay hidden">
        <div class="panel">
          <p class="panel-label">GAME SET</p>
          <h2 id="resultText">あなたの勝ち！</h2>
          <p id="finalScore" class="final-score">5 - 0</p>
          <button id="restartButton" class="primary-button" type="button">もう一度遊ぶ</button>
        </div>
      </div>

      <div id="pauseMenu" class="overlay hidden">
        <div class="panel">
          <p class="panel-label">PAUSED</p>
          <h2>ゲームを中断中</h2>
          <div class="pause-actions">
            <button id="resumeButton" class="primary-button" type="button">再開する</button>
            <button id="quitButton" class="secondary-button" type="button">終了してメニューへ</button>
          </div>
          <p class="help">もう一度 Esc キーを押しても再開できます</p>
        </div>
      </div>

      <div id="connectionExperiment" class="overlay connection-overlay hidden">
        <div class="panel connection-panel">
          <button id="closeConnectionButton" class="connection-close" type="button" aria-label="接続実験を閉じる">×</button>
          <p class="panel-label">P2P CONNECTION TEST</p>
          <h2 id="connectionTitle">接続実験</h2>

          <div class="connection-diagnostics" aria-live="polite">
            <p><span>接続</span><strong id="peerConnectionState">未接続</strong></p>
            <p><span>ICE</span><strong id="iceConnectionState">new</strong></p>
            <p><span>control</span><strong id="controlChannelState">closed</strong></p>
            <p><span>realtime</span><strong id="realtimeChannelState">closed</strong></p>
            <p><span>RTT</span><strong id="connectionRtt">—</strong></p>
          </div>

          <p id="connectionMessage" class="connection-message">接続方法を準備しています。</p>

          <section id="hostConnectionSection" class="connection-section hidden">
            <label for="offerOutput">1. Offerを相手へコピー</label>
            <textarea id="offerOutput" class="signal-text" readonly spellcheck="false" maxlength="65536"></textarea>
            <button id="copyOfferButton" class="secondary-button compact-button" type="button" disabled>Offerをコピー</button>

            <label for="answerInput">2. 相手のAnswerを貼り付け</label>
            <textarea id="answerInput" class="signal-text" placeholder="ここにAnswerを貼り付け" spellcheck="false" maxlength="65536" autocapitalize="off" autocomplete="off"></textarea>
            <button id="applyAnswerButton" class="primary-button compact-button" type="button">Answerを適用</button>
          </section>

          <section id="guestConnectionSection" class="connection-section hidden">
            <label for="offerInput">1. 相手のOfferを貼り付け</label>
            <textarea id="offerInput" class="signal-text" placeholder="ここにOfferを貼り付け" spellcheck="false" maxlength="65536" autocapitalize="off" autocomplete="off"></textarea>
            <button id="createAnswerButton" class="primary-button compact-button" type="button">Offerを適用してAnswerを作る</button>

            <label for="answerOutput">2. Answerを相手へコピー</label>
            <textarea id="answerOutput" class="signal-text" readonly spellcheck="false" maxlength="65536"></textarea>
            <button id="copyAnswerButton" class="secondary-button compact-button" type="button" disabled>Answerをコピー</button>
          </section>

          <button id="sendPingButton" class="secondary-button compact-button hidden" type="button">pingを送信</button>
          <button id="endConnectionButton" class="text-button" type="button">接続実験を終了</button>
        </div>
      </div>
    </section>
  </main>

  <script src="game.js"></script>
  <script type="module" src="./connection-experiment.mjs"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
